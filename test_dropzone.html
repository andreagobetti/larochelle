      <form action="/upload" class="dropzone" drop-zone="" id="file-dropzone"></form>

        <script type='text/javascript'>
        
            //DropzoneJS snippet - js

$.getScript('http://cdnjs.cloudflare.com/ajax/libs/dropzone/3.8.4/dropzone.min.js',function(){
  // instantiate the uploader
  $('#file-dropzone').dropzone({ 
    url: "sub_upload_new.asp?tipo_allegato="+3+"&id_tipo_allegato="+100,
    maxFilesize: 100,
    paramName: "uploadfile",
    maxThumbnailFilesize: 5,
    init: function() {
      
      this.on('success', function(file, json) {
      });
      
      this.on('addedfile', function(file) {
        
      });
      this.on("sending", function(file, xhr, formData) {
		  // Will send the filesize along with the file as POST data.
		  formData.append("tipo_allegato", 3);
		  console.log("sending");
		});
      
      this.on('drop', function(file) {
        alert('file');
      }); 
    }
  });
});

$(document).ready(function() {});
